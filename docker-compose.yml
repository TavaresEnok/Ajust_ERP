services:
  web:
    image: node:20-alpine
    working_dir: /workspace
    command: sh -c "corepack enable && corepack pnpm --filter @ajust/web dev"
    env_file:
      - .env.example
    environment:
      CI: "true"
      PORT: ${INTERNAL_WEB_PORT:-3000}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3001}
      WORKER_INTERNAL_URL: ${WORKER_INTERNAL_URL:-http://worker:3002}
      API_BASE_URL: http://localhost:${API_PORT:-8071}
      NEXT_PUBLIC_WS_URL: http://localhost:${API_PORT:-8071}
    volumes:
      - ./:/workspace
    ports:
      - "${WEB_PORT:-8070}:${INTERNAL_WEB_PORT:-3000}"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  api:
    image: node:20-alpine
    working_dir: /workspace
    command: sh -c "corepack enable && corepack pnpm --filter @ajust/api dev"
    env_file:
      - .env.example
    environment:
      CI: "true"
      PORT: ${INTERNAL_API_PORT:-3001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ajust}:${POSTGRES_PASSWORD:-ajust123}@postgres:5432/${POSTGRES_DB:-ajust_erp}?schema=public
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret}
      UPLOAD_ROOT: ${UPLOAD_ROOT:-/workspace/uploads}
      IXC_WEBHOOK_REQUIRE_SIGNATURE: ${IXC_WEBHOOK_REQUIRE_SIGNATURE:-true}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-change-this-secret-key-in-production}
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ajust-api
    volumes:
      - ./:/workspace
    ports:
      - "${API_PORT:-8071}:${INTERNAL_API_PORT:-3001}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/monitoring/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  worker:
    image: node:20-alpine
    working_dir: /workspace
    command: sh -c "corepack enable && corepack pnpm --filter @ajust/worker dev"
    env_file:
      - .env.example
    environment:
      CI: "true"
      PORT: ${INTERNAL_WORKER_PORT:-3002}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ajust}:${POSTGRES_PASSWORD:-ajust123}@postgres:5432/${POSTGRES_DB:-ajust_erp}?schema=public
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      IXC_RECONCILE_INTERVAL_MS: ${IXC_RECONCILE_INTERVAL_MS:-300000}
      EXPORT_RETENTION_DAYS: ${EXPORT_RETENTION_DAYS:-30}
      EXPORT_RETENTION_INTERVAL_MS: ${EXPORT_RETENTION_INTERVAL_MS:-3600000}
      IXC_MOCK_RECONCILE: ${IXC_MOCK_RECONCILE:-true}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-change-this-secret-key-in-production}
    volumes:
      - ./:/workspace
    ports:
      - "${WORKER_PORT:-8076}:${INTERNAL_WORKER_PORT:-3002}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ajust_erp}
      POSTGRES_USER: ${POSTGRES_USER:-ajust}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ajust123}
    ports:
      - "${POSTGRES_PORT:-8072}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ajust} -d ${POSTGRES_DB:-ajust_erp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory ${REDIS_MAXMEMORY:-512mb} --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-volatile-lru} --appendonly yes --save 60 1
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-8073}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped


  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "${PGADMIN_PORT:-8077}:80"
    depends_on:
      - postgres
    restart: unless-stopped

  # Centralized log aggregation — accessible at http://localhost:3100
  # Connect Grafana to http://loki:3100 as a Loki datasource to query logs.
  loki:
    image: grafana/loki:3.0.0
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  loki_data:
  redis_data:
